<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Gestion{% endblock %} · Quincaillerie</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <span class="brand-mark">Q</span>
    <span class="brand-text">Gestion&nbsp;Quincaillerie</span>
  </a>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Tableau de bord</a>
    <a href="{{ url_for('articles_list') }}" class="{{ 'active' if request.endpoint in ('articles_list','article_detail') }}">Articles</a>
    <a href="{{ url_for('stock_view') }}" class="{{ 'active' if request.endpoint == 'stock_view' }}">Stock</a>
    <a href="{{ url_for('clients_list') }}" class="{{ 'active' if request.endpoint in ('clients_list','client_detail') }}">Clients</a>
    <a href="{{ url_for('factures_list') }}" class="{{ 'active' if request.endpoint in ('factures_list','facture_detail') }}">Ventes</a>
  </nav>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
<footer class="foot">Données reconstruites depuis les exports Sage 100 Commercial · projet interne</footer>
</body>
</html>
